# ==============================================================
#  Configuration Aider — spécifique à ce dépôt
#
#  Elle se superpose à la configuration globale (~/.aider.conf.yml),
#  qui porte les modèles, les alias, les garde-fous et les réglages
#  de contexte. On ne déclare ici que ce qui dépend du projet.
# ==============================================================

# Consignes projet chargées en lecture seule à chaque démarrage :
# conventions de code, règles d'authentification, sécurité de la
# base et des migrations, workflow TDD.
read:
  - AGENTS.md

# Commande lancée par /test dans ce dépôt (pytest est configuré par
# pytest.ini, qui affiche aussi la couverture).
test-cmd: python -m pytest
