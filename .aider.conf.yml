# Exemple — la config active vit maintenant dans le dossier home (globale,
# partagée entre tous les projets). Ces fichiers sont conservés ici à titre
# de documentation/exemple pour ce repo.

# Modèle par défaut au lancement d'Aider (modifs simples)
model: ollama/qwen2.5-coder:14b

edit-format: diff

# Modèle léger utilisé pour les messages de commit et résumés d'historique
weak-model: ollama/qwen2.5-coder:7b

# Surveille les fichiers ouverts et applique les modifs via des commentaires "# ai:"
watch-files: true

# Adresse du serveur Ollama local (évite le warning OLLAMA_API_BASE au démarrage)
set-env:
  - OLLAMA_API_BASE=http://127.0.0.1:11434

model-settings-file: C:\Users\DELL_G15_5330\.aider.model.settings.yml

# Style visuel du terminal
dark-mode: true

# Valide et commit automatiquement chaque modification acceptée dans Git
auto-commits: true

# Désactive les signatures "Authored by Aider" dans les commits Git
attribute-author: false
attribute-committer: false
attribute-co-authored-by: false

# Fichiers de consignes à charger automatiquement en mémoire à chaque démarrage
read:
  - AGENTS.md
